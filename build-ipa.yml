# ---------------------------------------------------------------------------
# Compile l'application sans Mac et publie HorairesPrieres.ipa (non signé)
# dans les « Artifacts » de l'exécution. L'IPA est ensuite signé et installé
# par Sideloadly depuis Windows.
# ---------------------------------------------------------------------------
name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

env:
  # Versions de Xcode essayées, par ordre de préférence.
  XCODE_VERSIONS: "16.4 16.3 16.2 16.1 16"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler HorairesPrieres.ipa
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Xcode 16.x accepte encore une cible de déploiement iOS 12.0 (plage 12.0 à 18.x).
      # On préfère 16.4 : c'est le Xcode par défaut de macos-15 et le seul 16.x dont la
      # plateforme iOS (18.5) est préinstallée sur le runner. Avec 16.2, xcodebuild peut
      # refuser de compiler (« iOS 18.2 is not installed »). Les suivants servent de repli.
      - name: Sélectionner Xcode 16.x
        run: |
          set -euo pipefail
          XCODE=""
          for VERSION in $XCODE_VERSIONS; do
            if [ -d "/Applications/Xcode_${VERSION}.app" ]; then
              XCODE="/Applications/Xcode_${VERSION}.app"
              break
            fi
          done
          if [ -z "$XCODE" ]; then
            echo "::error::Aucun Xcode 16.x sur ce runner. Versions présentes :"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Xcode retenu : $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Installer XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (Release, sans signature)
        run: |
          set -euo pipefail
          xcodebuild \
            -project HorairesPrieres.xcodeproj \
            -scheme HorairesPrieres \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Vérifier le binaire (iOS 12.0 minimum, arm64)
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/HorairesPrieres.app"
          test -d "$APP"
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          echo "MinimumOSVersion : $MIN_OS"
          echo "Architectures    : $(lipo -archs "$APP/HorairesPrieres")"
          if [ "$MIN_OS" != "12.0" ]; then
            echo "::error::Cible de déploiement inattendue ($MIN_OS au lieu de 12.0)."
            exit 1
          fi

      - name: Empaqueter en .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/HorairesPrieres.app"
          rm -rf Payload HorairesPrieres.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HorairesPrieres.ipa Payload
          ls -lh HorairesPrieres.ipa

      - name: Publier l'IPA dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HorairesPrieres-ipa
          path: HorairesPrieres.ipa
          if-no-files-found: error
          retention-days: 30
