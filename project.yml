# ---------------------------------------------------------------------------
# XcodeGen : génère HorairesPrieres.xcodeproj (jamais versionné, recréé en CI)
# Commande : xcodegen generate
# ---------------------------------------------------------------------------
name: HorairesPrieres

options:
  bundleIdPrefix: fr.massy
  deploymentTarget:
    iOS: "12.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "2"

targets:
  HorairesPrieres:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: HorairesPrieres
        PRODUCT_BUNDLE_IDENTIFIER: fr.massy.horairesprieres
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

        # Info.plist fourni à la main, sans Storyboard
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"

        # iPad uniquement, iOS 12.0 minimum, Swift 5
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SUPPORTS_MACCATALYST: "NO"

        # Pas de catalogue d'images dans ce projet
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

        # Aucune signature Apple : Sideloadly signe l'IPA à l'installation
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

schemes:
  HorairesPrieres:
    build:
      targets:
        HorairesPrieres: all
    run:
      config: Debug
    archive:
      config: Release
